---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes:
    - ReadWriteOnce
  # longhorn (default) = defaultClassReplicaCount 3 -> volume replicated across 3 nodes
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
