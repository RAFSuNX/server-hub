---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-daily-update
  namespace: hermes
spec:
  schedule: "0 21 * * *"  # 3am Asia/Dhaka = 9pm UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: hermes
          restartPolicy: OnFailure
          containers:
            - name: updater
              image: bitnami/kubectl:latest
              command:
                - kubectl
                - rollout
                - restart
                - deployment/hermes
                - -n
                - hermes
