---
# GHCR pull secret — shared infra creds live in the k3s Doppler project (the "doppler" store).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: blueberrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: password
      remoteRef:
        key: GITHUB_TOKEN
---
# Bot secrets (k3s Doppler project, prd):
#   TELEGRAM_BLUEBERRIX_BOT_TOKEN - NEW: create a bot with @BotFather, add the token
#   TELEGRAM_CHAT_ID              - ALREADY EXISTS; reused so the bot only answers you
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blueberrix-secrets
  namespace: blueberrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: blueberrix-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TELEGRAM_BLUEBERRIX_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_CHAT_ID
      remoteRef:
        key: TELEGRAM_CHAT_ID
