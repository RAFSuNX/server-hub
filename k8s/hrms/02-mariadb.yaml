---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: hrms
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: hrms
spec:
  interval: 1h
  chart:
    spec:
      chart: mariadb
      version: "20.*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: hrms
  values:
    auth:
      rootPassword: ""
      existingSecret: hrms-db-secrets
      secretKeys:
        adminPasswordKey: mariadb-root-password
        userPasswordKey: mariadb-password
      database: frappe
      username: frappe
    primary:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 10Gi
    secondary:
      replicaCount: 0
