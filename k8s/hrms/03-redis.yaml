---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: hrms
spec:
  interval: 1h
  chart:
    spec:
      chart: redis
      version: "20.*"
      sourceRef:
        kind: HelmRepository
        name: bitnami-archive
        namespace: hrms
  values:
    auth:
      enabled: false
    master:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 2Gi
    replica:
      replicaCount: 0
