---
# Shared sites volume for all Frappe components
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-sites
  namespace: hrms
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# Single setup job: configure bench + create site (sequential)
apiVersion: batch/v1
kind: Job
metadata:
  name: frappe-setup
  namespace: hrms
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ['sh', '-c', 'until nc -z mariadb.hrms.svc.cluster.local 3306; do echo waiting for mariadb; sleep 3; done']
        - name: wait-for-redis
          image: busybox
          command: ['sh', '-c', 'until nc -z redis-cache.hrms.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: setup
          image: ghcr.io/rafsunx/frappe-hrms:latest
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
          command:
            - bash
            - -c
            - |
              set -e

              # Step 1: Configure bench
              ls -1 apps > sites/apps.txt
              [ -f sites/common_site_config.json ] || echo '{}' > sites/common_site_config.json
              bench set-config -g db_host $DB_HOST
              bench set-config -gp db_port $DB_PORT
              bench set-config -g redis_cache "redis://$REDIS_CACHE"
              bench set-config -g redis_queue "redis://$REDIS_QUEUE"
              bench set-config -g redis_socketio "redis://$REDIS_QUEUE"
              bench set-config -gp socketio_port 9000
              echo "Bench configured"

              # Step 2: Create site if not exists
              if [ -f sites/$SITE_NAME/site_config.json ]; then
                echo "Site $SITE_NAME already exists, skipping (data protected)"
              else
                bench new-site $SITE_NAME \
                  --mariadb-root-password $DB_ROOT_PASSWORD \
                  --admin-password $ADMIN_PASSWORD \
                  --install-app hrms \
                  --no-mariadb-socket
                echo "Site created"
              fi
              touch sites/.setup-complete
              echo "Setup complete"
          env:
            - name: DB_HOST
              value: mariadb.hrms.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: redis-cache.hrms.svc.cluster.local:6379
            - name: REDIS_QUEUE
              value: redis-queue.hrms.svc.cluster.local:6379
            - name: SITE_NAME
              value: hrms.rogx.cc
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-db-secrets
                  key: mariadb-root-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-admin
                  key: adminPassword
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
# Backend (gunicorn)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-backend
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-backend
  template:
    metadata:
      labels:
        app: frappe-backend
    spec:
      initContainers:
        - name: wait-for-site
          image: busybox
          command: ['sh', '-c', 'until [ -f /sites/.setup-complete ]; do echo "waiting for site setup..."; sleep 5; done']
          volumeMounts:
            - name: sites
              mountPath: /sites
      containers:
        - name: backend
          image: ghcr.io/rafsunx/frappe-hrms:latest
          env:
            - name: GUNICORN_WORKERS
              value: "4"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-backend
  namespace: hrms
spec:
  selector:
    app: frappe-backend
  ports:
    - port: 8000
      targetPort: 8000
---
# Websocket
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-websocket
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-websocket
  template:
    metadata:
      labels:
        app: frappe-websocket
    spec:
      initContainers:
        - name: wait-for-site
          image: busybox
          command: ['sh', '-c', 'until [ -f /sites/.setup-complete ]; do echo "waiting for site setup..."; sleep 5; done']
          volumeMounts:
            - name: sites
              mountPath: /sites
      containers:
        - name: websocket
          image: ghcr.io/rafsunx/frappe-hrms:latest
          command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: "10m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-websocket
  namespace: hrms
spec:
  selector:
    app: frappe-websocket
  ports:
    - port: 9000
      targetPort: 9000
---
# Queue workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-queue-short
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-queue-short
  template:
    metadata:
      labels:
        app: frappe-queue-short
    spec:
      initContainers:
        - name: wait-for-site
          image: busybox
          command: ['sh', '-c', 'until [ -f /sites/.setup-complete ]; do echo "waiting for site setup..."; sleep 5; done']
          volumeMounts:
            - name: sites
              mountPath: /sites
      containers:
        - name: worker
          image: ghcr.io/rafsunx/frappe-hrms:latest
          command: ["bench", "worker", "--queue", "short,default"]
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: "10m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-queue-long
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-queue-long
  template:
    metadata:
      labels:
        app: frappe-queue-long
    spec:
      initContainers:
        - name: wait-for-site
          image: busybox
          command: ['sh', '-c', 'until [ -f /sites/.setup-complete ]; do echo "waiting for site setup..."; sleep 5; done']
          volumeMounts:
            - name: sites
              mountPath: /sites
      containers:
        - name: worker
          image: ghcr.io/rafsunx/frappe-hrms:latest
          command: ["bench", "worker", "--queue", "long,default,short"]
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: "10m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
# Scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-scheduler
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-scheduler
  template:
    metadata:
      labels:
        app: frappe-scheduler
    spec:
      initContainers:
        - name: wait-for-site
          image: busybox
          command: ['sh', '-c', 'until [ -f /sites/.setup-complete ]; do echo "waiting for site setup..."; sleep 5; done']
          volumeMounts:
            - name: sites
              mountPath: /sites
      containers:
        - name: scheduler
          image: ghcr.io/rafsunx/frappe-hrms:latest
          command: ["bench", "schedule"]
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
# Frontend (nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-frontend
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-frontend
  template:
    metadata:
      labels:
        app: frappe-frontend
    spec:
      initContainers:
        - name: wait-for-site
          image: busybox
          command: ['sh', '-c', 'until [ -f /sites/.setup-complete ]; do echo "waiting for site setup..."; sleep 5; done']
          volumeMounts:
            - name: sites
              mountPath: /sites
      containers:
        - name: frontend
          image: ghcr.io/rafsunx/frappe-hrms:latest
          command: ["nginx-entrypoint.sh"]
          env:
            - name: BACKEND
              value: frappe-backend.hrms.svc.cluster.local:8000
            - name: SOCKETIO
              value: frappe-websocket.hrms.svc.cluster.local:9000
            - name: FRAPPE_SITE_NAME_HEADER
              value: hrms.rogx.cc
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: "127.0.0.1"
            - name: UPSTREAM_REAL_IP_HEADER
              value: X-Forwarded-For
            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "off"
            - name: PROXY_READ_TIMEOUT
              value: "120"
            - name: CLIENT_MAX_BODY_SIZE
              value: 50m
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-frontend
  namespace: hrms
spec:
  selector:
    app: frappe-frontend
  ports:
    - port: 80
      targetPort: 8080
