---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: frappe
  namespace: hrms
spec:
  interval: 1h
  url: https://helm.erpnext.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frappe-hrms
  namespace: hrms
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: erpnext
      version: "7.*"
      sourceRef:
        kind: HelmRepository
        name: frappe
        namespace: hrms
  values:
    image:
      repository: frappe/erpnext
      tag: v16.23.1

    # Use our own MariaDB
    dbHost: mariadb.hrms.svc.cluster.local
    dbPort: 3306
    dbRootUser: root
    dbExistingSecret: hrms-db-secrets
    dbExistingSecretPasswordKey: mariadb-root-password

    # Use our own Redis
    externalRedis:
      cache: redis.hrms.svc.cluster.local:6379
      queue: redis.hrms.svc.cluster.local:6379

    # Disable bundled subcharts
    mariadb-subchart:
      enabled: false
    redis-cache:
      enabled: false
    redis-queue:
      enabled: false

    nginx:
      replicaCount: 1
      service:
        type: ClusterIP
        port: 8080

    worker:
      gunicorn:
        replicaCount: 1
      default:
        replicaCount: 1
      short:
        replicaCount: 1
      long:
        replicaCount: 1

    scheduler:
      enabled: true

    persistence:
      worker:
        enabled: true
        storageClass: longhorn
        size: 10Gi

    createSite:
      enabled: true
      siteName: hrms.rogx.cc
      dbType: mariadb
      adminPasswordSecret: hrms-admin
      adminPasswordSecretKey: adminPassword
      installApps:
        - hrms
