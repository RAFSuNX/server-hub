---
# Syncs open360 secrets from Doppler (k3s project) into k8s Secrets via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open360-secrets
  namespace: open360
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: open360-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: OPEN360_DATABASE_URL
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: OPEN360_NEXTAUTH_SECRET
    - secretKey: NEXTAUTH_URL
      remoteRef:
        key: OPEN360_NEXTAUTH_URL
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: OPEN360_GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: OPEN360_GOOGLE_CLIENT_SECRET
    - secretKey: SMTP_HOST
      remoteRef:
        key: OPEN360_SMTP_HOST
    - secretKey: SMTP_PORT
      remoteRef:
        key: OPEN360_SMTP_PORT
    - secretKey: SMTP_USER
      remoteRef:
        key: OPEN360_SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: OPEN360_SMTP_PASS
    - secretKey: SMTP_FROM
      remoteRef:
        key: OPEN360_SMTP_FROM
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: OPEN360_ENCRYPTION_KEY
    - secretKey: CRON_SECRET
      remoteRef:
        key: OPEN360_CRON_SECRET
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: OPEN360_STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: OPEN360_STRIPE_WEBHOOK_SECRET
    - secretKey: STRIPE_PRO_PRICE_ID
      remoteRef:
        key: OPEN360_STRIPE_PRO_PRICE_ID
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: open360
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: password
      remoteRef:
        key: GITHUB_TOKEN
---
# Postgres password synced separately so the postgres pod can reference it directly
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: open360
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: OPEN360_POSTGRES_PASSWORD
