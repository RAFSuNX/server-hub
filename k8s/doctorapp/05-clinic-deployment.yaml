apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-dashboard
  namespace: doctorapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinic-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: clinic-dashboard
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: clinic-dashboard
          image: ghcr.io/ai-avatar-bangladesh-ltd/doctorapp-clinic:test
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
