---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qbittorrent
  name: qbittorrent
  namespace: media
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - env:
        - name: VPN_SERVICE_PROVIDER
          value: custom
        - name: VPN_TYPE
          value: wireguard
        - name: WIREGUARD_ENDPOINT_IP
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_ENDPOINT_IP
              name: gluetun-vpn
        - name: WIREGUARD_ENDPOINT_PORT
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_ENDPOINT_PORT
              name: gluetun-vpn
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_PRIVATE_KEY
              name: gluetun-vpn
        - name: WIREGUARD_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_PUBLIC_KEY
              name: gluetun-vpn
        - name: WIREGUARD_ADDRESSES
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_ADDRESSES
              name: gluetun-vpn
        - name: FIREWALL_VPN_INPUT_PORTS
          value: 8080,6881
        - name: FIREWALL_INPUT_PORTS
          value: 8080,6881
        - name: TZ
          value: UTC
        - name: DNS_ADDRESS
          value: 1.1.1.1
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 10.42.0.0/16,10.43.0.0/16
        - name: WIREGUARD_ALLOWED_IPS
          value: 0.0.0.0/0
        - name: WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL
          value: 25s
        - name: WIREGUARD_MTU
          value: "1280"
        - name: DNS_KEEP_NAMESERVER
          value: "on"
        image: qmcgaw/gluetun:latest
        imagePullPolicy: Always
        name: gluetun
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 6881
          name: tcp
          protocol: TCP
        - containerPort: 6881
          name: udp
          protocol: UDP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/net/tun
          name: dev-tun
      - env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "100"
        - name: TZ
          value: UTC
        - name: WEBUI_PORT
          value: "8080"
        image: linuxserver/qbittorrent:latest
        imagePullPolicy: Always
        name: qbittorrent
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /downloads
          name: downloads
      dnsConfig:
        options:
        - name: ndots
          value: "2"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /dev/net/tun
          type: CharDevice
        name: dev-tun
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - hostPath:
          path: /mnt/storage/Downloads
          type: Directory
        name: downloads
