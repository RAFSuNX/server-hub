---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-updater
  namespace: media
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: image-updater
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  for deploy in jellyfin sonarr radarr prowlarr qbittorrent qbittorrent-warp flaresolverr; do
                    kubectl rollout restart deployment/$deploy -n media
                    echo "restarted $deploy"
                  done
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
