---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flaresolverr
  name: flaresolverr
  namespace: media
  annotations:
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: flaresolverr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: prowlarr
              topologyKey: kubernetes.io/hostname
      containers:
      - env:
        - name: LOG_LEVEL
          value: info
        - name: LOG_HTML
          value: "false"
        - name: TZ
          value: UTC
        image: ghcr.io/flaresolverr/flaresolverr:latest
        imagePullPolicy: Always
        name: flaresolverr
        ports:
        - containerPort: 8191
          protocol: TCP
        resources:

          requests:

            cpu: "200m"

            memory: "512Mi"

          limits:

            cpu: "2000m"

            memory: "3Gi"
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
