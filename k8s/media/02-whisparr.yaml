---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisparr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: piraeus-storage
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisparr
  namespace: media
  labels:
    app: whisparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisparr
  template:
    metadata:
      labels:
        app: whisparr
    spec:
      containers:
        - name: whisparr
          image: ghcr.io/hotio/whisparr:latest
          ports:
            - containerPort: 6969
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: whisparr-config
        - name: media
          hostPath:
            path: /mnt/storage/whisparr
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: /mnt/storage/Downloads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: whisparr
  namespace: media
spec:
  selector:
    app: whisparr
  ports:
    - port: 6969
      targetPort: 6969
  type: ClusterIP
