---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qbittorrent-warp
  name: qbittorrent-warp
  namespace: media
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qbittorrent-warp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent-warp
        app.kubernetes.io/name: qbittorrent-warp
    spec:
      containers:
      - env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: UTC
        - name: WEBUI_PORT
          value: "8080"
        image: ghcr.io/rafsunx/qbittorrent-warp:latest
        imagePullPolicy: Always
        name: qbittorrent-warp
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 6881
          name: torrent-tcp
          protocol: TCP
        - containerPort: 6881
          name: torrent-udp
          protocol: UDP
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /downloads
          name: downloads
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - systemb
                - systemc
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-warp-config
      - hostPath:
          path: /mnt/storage/Downloads
          type: DirectoryOrCreate
        name: downloads
