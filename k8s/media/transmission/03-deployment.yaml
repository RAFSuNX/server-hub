---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: transmission
  name: transmission
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: transmission
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: transmission
        app.kubernetes.io/name: transmission
    spec:
      containers:
      - name: warp
        image: ghcr.io/rafsunx/warp-docker:slim-latest
        imagePullPolicy: Always
        env:
        - name: WARP_SLEEP
          value: "3"
        - name: WARP_PROTOCOL
          value: WireGuard
        - name: WARP_KILL_SWITCH
          value: "1"
        - name: WARP_WATCHDOG
          value: "1"
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "MKNOD"]
        volumeMounts:
        - mountPath: /dev/net/tun
          name: dev-tun
        - mountPath: /var/lib/cloudflare-warp
          name: warp-data
        readinessProbe:
          exec:
            command: ["/healthcheck/index.sh"]
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
        livenessProbe:
          exec:
            command: ["/healthcheck/index.sh"]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      - name: transmission
        image: linuxserver/transmission:latest
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "100"
        - name: TZ
          value: UTC
        - name: TRANSMISSION_DOWNLOAD_DIR
          value: /downloads
        - name: TRANSMISSION_INCOMPLETE_DIR_ENABLED
          value: "false"
        ports:
        - containerPort: 9091
          name: http
          protocol: TCP
        - containerPort: 51413
          name: torrent-tcp
          protocol: TCP
        - containerPort: 51413
          name: torrent-udp
          protocol: UDP
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          capabilities:
            add: ["NET_RAW"]
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /downloads
          name: downloads
      dnsConfig:
        options:
        - name: ndots
          value: "2"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /dev/net/tun
          type: CharDevice
        name: dev-tun
      - name: warp-data
        persistentVolumeClaim:
          claimName: transmission-warp-data
      - name: config
        persistentVolumeClaim:
          claimName: transmission-config
      - hostPath:
          path: /mnt/storage/Downloads
          type: Directory
        name: downloads
