apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard
  namespace: monitoring
  labels:
    app: kubernetes-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9090
      protocol: TCP
  selector:
    app: kubernetes-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-metrics-scraper
  namespace: monitoring
  labels:
    app: dashboard-metrics-scraper
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: dashboard-metrics-scraper
