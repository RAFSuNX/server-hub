apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: piraeus-storage
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  # Storage pool to use
  storagePool: pool1
  # Replicate to all 3 nodes
  placementCount: "3"
  # Prefer local replica when scheduled
  allowRemoteVolumeAccess: "false"
  # Do not add extra quorum tiebreaker replicas
  DrbdOptions/auto-add-quorum-tiebreaker: "false"
  # Use DRBD protocol C (synchronous)
  DrbdOptions/Net/protocol: C
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: piraeus-local
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  storagePool: pool1
  # No replication - local only (faster)
  placementCount: "1"
  allowRemoteVolumeAccess: "false"
