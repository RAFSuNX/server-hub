---
# App secrets pulled from Doppler project "expertsschool" (prd config).
# Requires a ClusterSecretStore named "doppler-expertsschool" backed by a Doppler
# service token scoped to the expertsschool project, prd environment.
#
# Bootstrap the token (out-of-band, not in git):
#   kubectl create secret generic doppler-expertsschool-token \
#     --from-literal=dopplerToken=<doppler service token for expertsschool/prd> \
#     -n default
#
# REDIS_URL is intentionally NOT synced here - it's a fixed in-cluster address,
# set in 02-configmap.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: expertsschool-secrets
  namespace: expertsschool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-expertsschool
  target:
    name: expertsschool-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: DATABASE_OWNER_URL
      remoteRef:
        key: DATABASE_OWNER_URL
    - secretKey: FIREBASE_PROJECT_ID
      remoteRef:
        key: FIREBASE_PROJECT_ID
    - secretKey: FIREBASE_CLIENT_EMAIL
      remoteRef:
        key: FIREBASE_CLIENT_EMAIL
    - secretKey: FIREBASE_PRIVATE_KEY
      remoteRef:
        key: FIREBASE_PRIVATE_KEY
    - secretKey: FIREBASE_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: FIREBASE_SERVICE_ACCOUNT_JSON
    - secretKey: NEXT_PUBLIC_FIREBASE_API_KEY
      remoteRef:
        key: NEXT_PUBLIC_FIREBASE_API_KEY
    - secretKey: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      remoteRef:
        key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - secretKey: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      remoteRef:
        key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - secretKey: NEXT_PUBLIC_FIREBASE_APP_ID
      remoteRef:
        key: NEXT_PUBLIC_FIREBASE_APP_ID
    - secretKey: R2_ACCOUNT_ID
      remoteRef:
        key: R2_ACCOUNT_ID
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: R2_SECRET_ACCESS_KEY
    - secretKey: R2_BUCKET
      remoteRef:
        key: R2_BUCKET
    - secretKey: VIDEO_TOKEN_SECRET
      remoteRef:
        key: VIDEO_TOKEN_SECRET
    - secretKey: VIDEO_WORKER_URL
      remoteRef:
        key: VIDEO_WORKER_URL
    - secretKey: SSLCOMMERZ_STORE_ID
      remoteRef:
        key: SSLCOMMERZ_STORE_ID
    - secretKey: SSLCOMMERZ_STORE_PASSWORD
      remoteRef:
        key: SSLCOMMERZ_STORE_PASSWORD
    - secretKey: SSLCOMMERZ_SANDBOX
      remoteRef:
        key: SSLCOMMERZ_SANDBOX
    - secretKey: APP_URL
      remoteRef:
        key: APP_URL
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
---
# GHCR pull secret stays on the k3s Doppler project (shared infra credentials).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: expertsschool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: password
      remoteRef:
        key: GITHUB_TOKEN
