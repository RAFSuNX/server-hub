---
# Derived cache / leaderboard / rate-limit layer. Losing it costs a rebuild
# from Postgres (Neon), never data - one replica + small PVC is enough.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expertsschool-redis-data
  namespace: expertsschool
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: expertsschool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: expertsschool-redis
  template:
    metadata:
      labels:
        app: expertsschool-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--appendonly"
            - "yes"
            - "--dir"
            - "/data"
            # Bound memory + evict LRU under pressure (cache is derived data) so
            # growth never OOM-kills the pod (limit is 512Mi). Leaves headroom
            # for AOF buffers / copy-on-write.
            - "--maxmemory"
            - "384mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: expertsschool-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: expertsschool
spec:
  selector:
    app: expertsschool-redis
  ports:
    - port: 6379
      targetPort: 6379
