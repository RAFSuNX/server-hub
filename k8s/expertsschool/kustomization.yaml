apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-secret.yaml
  - 02-configmap.yaml
  - 03-redis.yaml
  - 05-deployment.yaml
  - 06-service.yaml
  - 07-hpa.yaml
  - 08-cloudflared.yaml
  - 09-pdb.yaml

# Pinned to an immutable per-release tag (not :latest): Flux rolls out this
# exact image itself, so there's no manual pod recycling and no fighting Flux.
# Bump both to the new sha-<commit> after each build to deploy.
images:
  - name: ghcr.io/ai-avatar-bangladesh-ltd/expertsschool
    newTag: sha-cd0be2b74698f863f69fbeb4db813013d04a949b
  - name: ghcr.io/ai-avatar-bangladesh-ltd/expertsschool-migrate
    newTag: sha-cd0be2b74698f863f69fbeb4db813013d04a949b
