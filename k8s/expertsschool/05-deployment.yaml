apiVersion: apps/v1
kind: Deployment
metadata:
  name: expertsschool
  namespace: expertsschool
spec:
  # No replicas - HPA owns this (minReplicas 2). Pinning it fights the HPA.
  selector:
    matchLabels:
      app: expertsschool
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: expertsschool
    spec:
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: expertsschool
          image: ghcr.io/ai-avatar-bangladesh-ltd/expertsschool:placeholder
          ports:
            - containerPort: 3000
          env:
            # Some cluster nodes have broken IPv6 egress; Neon/Firebase/etc.
            # publish AAAA records, so Node's Happy-Eyeballs opens a blackholed
            # IPv6 socket and hangs. Force IPv4-only for all outbound.
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first --no-network-family-autoselection"
          envFrom:
            - configMapRef:
                name: expertsschool-config
            - secretRef:
                name: expertsschool-secrets
          lifecycle:
            preStop:
              exec:
                # Sleep so this pod is pulled from the Service endpoints BEFORE
                # the process stops -> in-flight requests drain instead of being
                # cut (the "aborted" errors), and clients aren't bounced onto a
                # dying pod during a rollout.
                command: ["sleep", "8"]
          # startup gates liveness+readiness during boot, so a cold pod still
          # warming up (DB connect, first render) is never killed mid-startup.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 3
            failureThreshold: 30 # up to ~90s to come up before liveness bites
            timeoutSeconds: 5
          # readiness = "can it serve?" (deps reachable). On fail the pod is only
          # removed from the load balancer, NOT killed. 5s timeout so a 1-2s DB
          # blip doesn't yank every pod out at once.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # liveness = "is the process alive?" Hits /api/live, which touches NO
          # dependencies, so a slow DB/Redis can never get a pod KILLED (which
          # was causing the restart cascades).
          livenessProbe:
            httpGet:
              path: /api/live
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
