apiVersion: apps/v1
kind: Deployment
metadata:
  name: expertsschool
  namespace: expertsschool
spec:
  # No replicas - HPA owns this (minReplicas 2). Pinning it fights the HPA.
  selector:
    matchLabels:
      app: expertsschool
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: expertsschool
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: expertsschool
          image: ghcr.io/ai-avatar-bangladesh-ltd/expertsschool:placeholder
          ports:
            - containerPort: 3000
          env:
            # Some cluster nodes have broken IPv6 egress; Neon/Firebase/etc.
            # publish AAAA records, so Node's Happy-Eyeballs opens a blackholed
            # IPv6 socket and hangs. Force IPv4-only for all outbound.
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first --no-network-family-autoselection"
          envFrom:
            - configMapRef:
                name: expertsschool-config
            - secretRef:
                name: expertsschool-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # readiness proves deps (DB/Valkey) reachable; liveness just checks the process
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
