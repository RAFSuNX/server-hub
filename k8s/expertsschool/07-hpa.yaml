apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: expertsschool
  namespace: expertsschool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: expertsschool
  # Floor of 3 for headroom: this app is I/O-bound (CPU sits ~4% under load),
  # so CPU-based scaling barely fires - keep enough baseline pods to absorb a
  # burst while scaling reacts, and add memory as a second scale signal.
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
