---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: expertsschool
data:
  01-app-user.sh: |
    #!/bin/bash
    set -e
    # Use psql variable binding so special chars in the password don't break the SQL.
    psql -v ON_ERROR_STOP=1 \
         -v "app_pass=${POSTGRES_APP_PASSWORD}" \
         -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    CREATE ROLE app_user LOGIN PASSWORD :'app_pass';
    GRANT USAGE ON SCHEMA public TO app_user;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO app_user;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: expertsschool
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: expertsschool
            - name: POSTGRES_USER
              value: expertsschool
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expertsschool-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expertsschool-secrets
                  key: POSTGRES_APP_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, expertsschool, -d, expertsschool]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: expertsschool
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
