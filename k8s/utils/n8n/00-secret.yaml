---
# Pulls N8N_ENCRYPTION_KEY from Doppler (shared k3s project) so the key is not
# tied to the PVC. Add the key in Doppler before deploying:
#   doppler secrets set N8N_ENCRYPTION_KEY=<openssl rand -hex 32> --project k3s --config prd
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secret
  namespace: utils
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: n8n-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: N8N_ENCRYPTION_KEY
