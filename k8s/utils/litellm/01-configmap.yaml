    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_admin_ui: true

    router_settings:
      # Rate-limit-aware routing across the 3 separate agentrouter accounts.
      # usage-based-routing-v2 prefers the key with the most available quota and
      # skips keys currently on cooldown, so a rate-limited/starved account doesn't
      # take down the request — the next account picks it up.
      routing_strategy: usage-based-routing-v2
      cooldown_time: 60        # seconds to cool down a key after a failure/rate-limit
      allowed_fails: 3         # park a key after 3 fails in the cooldown window
      enable_pre_call_checks: true

    litellm_settings:
      set_verbose: false
      json_logs: true
      request_timeout: 600
      num_retries: 2
      max_connections: 20
      max_keepalive_connections: 10
      keepalive_expiry: 300
      drop_params: true
