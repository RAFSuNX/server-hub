---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: utils
data:
  config.yaml: |
    # agentrouter: 3 keys load-balanced per model (usage-based-routing-v2).
    # Anthropic SDK stainless headers required — returns 401 without them.
    # Models confirmed available 2026-11-25:
    #   claude-opus-4-8, claude-opus-5, deepseek-v4-flash
    #   gpt-6-astra (unlimited 24/7), gpt-6.1-sol (recommended, low multiplier)
    #   gpt-5.6-sol
    # claude-opus-5.5 temporarily offline per agentrouter notice.
    # bynara removed 2026-11-25 — account out of credits.
    model_list:
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: &agentrouter_headers
            user-agent: Anthropic/Python 0.117.1
            x-stainless-lang: python
            x-stainless-package-version: "0.117.1"
            x-stainless-os: Linux
            x-stainless-arch: x64
            x-stainless-runtime: CPython
            x-stainless-runtime-version: "3.13.5"
            x-stainless-async: "false"
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/deepseek-v4-flash
        litellm_params:
          model: anthropic/deepseek-v4-flash
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/deepseek-v4-flash
        litellm_params:
          model: anthropic/deepseek-v4-flash
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/deepseek-v4-flash
        litellm_params:
          model: anthropic/deepseek-v4-flash
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/gpt-6-astra
        litellm_params:
          model: openai/gpt-6-astra
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/gpt-6-astra
        litellm_params:
          model: openai/gpt-6-astra
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/gpt-6-astra
        litellm_params:
          model: openai/gpt-6-astra
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/gpt-5.6-sol
        litellm_params:
          model: openai/gpt-5.6-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/gpt-5.6-sol
        litellm_params:
          model: openai/gpt-5.6-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/gpt-5.6-sol
        litellm_params:
          model: openai/gpt-5.6-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/gpt-6.1-sol
        litellm_params:
          model: openai/gpt-6.1-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/gpt-6.1-sol
        litellm_params:
          model: openai/gpt-6.1-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/gpt-6.1-sol
        litellm_params:
          model: openai/gpt-6.1-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_admin_ui: true

    router_settings:
      routing_strategy: usage-based-routing-v2
      cooldown_time: 60
      allowed_fails: 3
      enable_pre_call_checks: true

    litellm_settings:
      set_verbose: false
      json_logs: true
      request_timeout: 600
      num_retries: 2
      max_connections: 20
      max_keepalive_connections: 10
      keepalive_expiry: 300
      drop_params: true
