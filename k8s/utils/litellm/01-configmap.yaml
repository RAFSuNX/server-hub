    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_admin_ui: true

    router_settings:
      # usage-based-routing-v2: prefers key with most quota, skips rate-limited keys
      routing_strategy: usage-based-routing-v2
      cooldown_time: 60
      allowed_fails: 3
      enable_pre_call_checks: true

    litellm_settings:
      set_verbose: false
      json_logs: true
      request_timeout: 600
      num_retries: 2
      max_connections: 20
      max_keepalive_connections: 10
      keepalive_expiry: 300
      drop_params: true
