---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: utils
data:
  config.yaml: |
    # Three deployments share model_name "agentrouter/glm-5.3" -> LiteLLM
    # load-balances every request across all three keys (round-robin style).
    model_list:
      - model_name: agentrouter/glm-5.3
        litellm_params:
          model: anthropic/glm-5.3
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: &agentrouter_headers
            user-agent: Anthropic/Python 0.117.1
            x-stainless-lang: python
            x-stainless-package-version: "0.117.1"
            x-stainless-os: Linux
            x-stainless-arch: x64
            x-stainless-runtime: CPython
            x-stainless-runtime-version: "3.13.5"
            x-stainless-async: "false"
      - model_name: agentrouter/glm-5.3
        litellm_params:
          model: anthropic/glm-5.3
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/glm-5.3
        litellm_params:
          model: anthropic/glm-5.3
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: agentrouter/deepseek-v4-flash
        litellm_params:
          model: anthropic/deepseek-v4-flash
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/deepseek-v4-flash
        litellm_params:
          model: anthropic/deepseek-v4-flash
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: agentrouter/deepseek-v4-flash
        litellm_params:
          model: anthropic/deepseek-v4-flash
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      - model_name: openai/gpt-5.6-sol
        litellm_params:
          model: anthropic/gpt-5.6-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: *agentrouter_headers
      - model_name: openai/gpt-5.6-sol
        litellm_params:
          model: anthropic/gpt-5.6-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
      - model_name: openai/gpt-5.6-sol
        litellm_params:
          model: anthropic/gpt-5.6-sol
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_3
          extra_headers: *agentrouter_headers

      # bynara router (OpenAI-compatible /v1), free-tier models
      - model_name: bynara/deepseek-v4.1-flash-free
        litellm_params:
          model: openai/deepseek-v4.1-flash-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY
      - model_name: bynara/glm-5.3-flash-free
        litellm_params:
          model: openai/glm-5.3-flash-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY
      - model_name: bynara/glm-5.3-free
        litellm_params:
          model: openai/glm-5.3-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY
      - model_name: bynara/ling-3.0-flash-fin-free
        litellm_params:
          model: openai/ling-3.0-flash-fin-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY
      - model_name: bynara/muse-spark-1.3-contributor-free
        litellm_params:
          model: openai/muse-spark-1.3-contributor-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY
      - model_name: bynara/nemotron-3.5-lightning-free
        litellm_params:
          model: openai/nemotron-3.5-lightning-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY
      - model_name: bynara/qwen3.8-flash-free
        litellm_params:
          model: openai/qwen3.8-flash-free
          api_base: https://router.bynara.id/v1
          api_key: os.environ/BYNARA_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_admin_ui: true

    router_settings:
      # Rate-limit-aware routing across the 3 separate agentrouter accounts.
      # usage-based-routing-v2 prefers the key with the most available quota and
      # skips keys currently on cooldown, so a rate-limited/starved account doesn't
      # take down the request — the next account picks it up.
      routing_strategy: usage-based-routing-v2
      cooldown_time: 60        # seconds to cool down a key after a failure/rate-limit
      allowed_fails: 3         # park a key after 3 fails in the cooldown window
      enable_pre_call_checks: true

    litellm_settings:
      set_verbose: false
      json_logs: true
      request_timeout: 600
      num_retries: 2
      max_connections: 20
      max_keepalive_connections: 10
      keepalive_expiry: 300
      drop_params: true
