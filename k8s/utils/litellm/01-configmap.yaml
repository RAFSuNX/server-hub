---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: utils
data:
  config.yaml: |
    # agentrouter: 3 keys load-balanced per model (usage-based-routing-v2).
    # Anthropic SDK stainless headers required - returns 401 without them.
    # Models confirmed available 2026-11-25: claude-opus-4-8, claude-opus-5,
    #   deepseek-v4-flash, gpt-6-astra (unlimited 24/7), gpt-6.1-sol (recommended, low multiplier)
    # claude-opus-5.5 temporarily offline on agentrouter per their notice.
    model_list:
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_1
          extra_headers: &agentrouter_headers
            user-agent: Anthropic/Python 0.117.1
            x-stainless-lang: python
            x-stainless-package-version: "0.117.1"
            x-stainless-os: Linux
            x-stainless-arch: x64
            x-stainless-runtime: CPython
            x-stainless-runtime-version: "3.13.5"
            x-stainless-async: "false"
      - model_name: agentrouter/claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_base: https://agentrouter.org
          api_key: os.environ/AGENTROUTER_API_KEY_2
          extra_headers: *agentrouter_headers
