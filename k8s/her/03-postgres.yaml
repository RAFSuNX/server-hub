---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: her-postgres-data
  namespace: her
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: her
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: her-postgres
  template:
    metadata:
      labels:
        app: her-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_USER
              value: her
            - name: POSTGRES_DB
              value: her
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: her-server-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "her"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: her-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: her
spec:
  selector:
    app: her-postgres
  ports:
    - port: 5432
      targetPort: 5432
