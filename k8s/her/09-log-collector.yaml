apiVersion: v1
kind: ServiceAccount
metadata:
  name: her-log-collector
  namespace: her
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: her-log-reader
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: her-log-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: her-log-reader
subjects:
  - kind: ServiceAccount
    name: her-log-collector
    namespace: her
---
# Logs accumulate indefinitely — delete files manually inside the pod when needed.
# reclaimPolicy Retain means the PV survives even if the PVC is deleted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: her-logs
  namespace: her
  annotations:
    # Remind operators: data is NOT auto-deleted. Manual cleanup only.
    her.app/retention: "manual"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: her-log-collector
  namespace: her
spec:
  replicas: 1
  selector:
    matchLabels:
      app: her-log-collector
  template:
    metadata:
      labels:
        app: her-log-collector
    spec:
      serviceAccountName: her-log-collector
      # Run as root so we can always write to the Longhorn volume regardless of fsGroup.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      terminationGracePeriodSeconds: 10
      containers:
        - name: collector
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /logs

              log() {
                echo "[$(date -u +%FT%TZ)] $*"
              }

              LOG_FILE="/logs/her-$(date +%F).log"
              log "=== Log collector started ===" >> "$LOG_FILE"

              # kubectl logs --follow only follows pods that existed when the command started.
              # Restart every 10 minutes so new pods (deploys, restarts) are always picked up.
              # On restart we get brief duplicates from pod start but never gaps.
              # Append-only (>>) so old files are never touched or deleted.
              RESTART_INTERVAL=600
              while true; do
                CURRENT_DATE=$(date +%F)
                LOG_FILE="/logs/her-${CURRENT_DATE}.log"
                STARTED=$(date +%s)

                log "Streaming her-server logs → $LOG_FILE" >> "$LOG_FILE"

                kubectl logs \
                  -n her \
                  -l app=her-server \
                  --all-containers \
                  --prefix \
                  --timestamps \
                  --follow \
                  2>&1 \
                | grep -v '"GET /health HTTP' \
                | tee -a "$LOG_FILE" &
                PID=$!

                # Check every 30s — restart at midnight (log rotation) or after
                # RESTART_INTERVAL seconds (pick up new pods from rolling deploys).
                while kill -0 $PID 2>/dev/null; do
                  sleep 30
                  NEW_DATE=$(date +%F)
                  ELAPSED=$(( $(date +%s) - STARTED ))
                  if [ "$NEW_DATE" != "$CURRENT_DATE" ]; then
                    log "Date changed to $NEW_DATE — rotating log file" >> "$LOG_FILE"
                    kill $PID 2>/dev/null
                    break
                  elif [ "$ELAPSED" -ge "$RESTART_INTERVAL" ]; then
                    log "Restarting to pick up new pods after ${ELAPSED}s" >> "$LOG_FILE"
                    kill $PID 2>/dev/null
                    break
                  fi
                done

                wait $PID 2>/dev/null || true
                sleep 2
              done
          volumeMounts:
            - name: logs
              mountPath: /logs
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: her-logs
