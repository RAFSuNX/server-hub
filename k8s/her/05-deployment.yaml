apiVersion: apps/v1
kind: Deployment
metadata:
  name: her-server
  namespace: her
spec:
  replicas: 2
  selector:
    matchLabels:
      app: her-server
  template:
    metadata:
      labels:
        app: her-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: her-server
          image: ghcr.io/rafsunx/her-server:sha-c4da9d1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: her-server-config
            - secretRef:
                name: her-server-secrets
          env:
            # Single-user deployment right now - 4 workers (the image's default) x 2 replicas
            # means 8 full copies of the app's connection pools/clients for no concurrent load.
            - name: WORKERS
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "4Gi"
