apiVersion: apps/v1
kind: Deployment
metadata:
  name: her-server
  namespace: her
spec:
  replicas: 2
  selector:
    matchLabels:
      app: her-server
  template:
    metadata:
      labels:
        app: her-server
      # Must be > uvicorn --timeout-graceful-shutdown (30s) + preStop sleep (10s).
      terminationGracePeriodSeconds: 60
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: her-server
          image: ghcr.io/rafsunx/her-server:sha-e3bfba3
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: her-server-config
            - secretRef:
                name: her-server-secrets
          env:
            # 4 workers × 2 replicas = 8 workers total.
            # DB connections: budget(40) / workers(4) = 10/worker × 8 = 80 connections ≤ 200.
            - name: WORKERS
              value: "4"
          lifecycle:
            preStop:
              exec:
                # Gives k8s time to remove the pod from the load balancer before
                # SIGTERM fires. Without this, new requests still arrive at the pod
                # during the ~5s it takes iptables rules to propagate, then fail.
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
