apiVersion: v1
kind: ConfigMap
metadata:
  name: her-server-config
  namespace: her
data:
  # ── Active chat models ─────────────────────────────────────────────────────
  # "one"          → OpenRouter (Muse Spark 1.2 Contributor)
  # "two"          → Fireworks
  # "three"        → Baseten
  # "four"         → Nous portal (Hermes 4 405B — $0.09/M in, $0.37/M out)
  # "four,two"     → Nous primary, Fireworks fallback
  ACTIVE_CHAT_MODELS: "six,four,seven"
  ACTIVE_ONBOARDING_MODEL: "two"
  ACTIVE_PROACTIVE_MODEL: "one"

  # ── Embeddings ─────────────────────────────────────────────────────────────
  # Must match the vector column size in the DB. Changing requires a migration.
  # URL and model name are hardcoded in llm/models/embeddings/embeddings_model_one.py.
  EMBEDDINGS_MODEL_ONE_DIMENSIONS: "1024"

  # ── Redis ──────────────────────────────────────────────────────────────────
  # Required for cross-worker rate limiting and OTP counters.
  REDIS_URL: "redis://redis:6379"

  # ── Auth ───────────────────────────────────────────────────────────────────
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRES_MINUTES: "43200"
  OTP_TTL_MINUTES: "10"
  OTP_MAX_ATTEMPTS: "5"
  OTP_REQUEST_LIMIT_PER_HOUR: "5"

  # ── Game mechanics ─────────────────────────────────────────────────────────
  GIRLFRIEND_UNLOCK_TRUST_SCORE: "65"
  MIN_AGE: "18"
  MAX_AGE_GAP_YEARS: "8"

  # ── Firebase ───────────────────────────────────────────────────────────────
  # Not secret — same project_id already in the committed google-services.json.
  FIREBASE_PROJECT_ID: "itsher69"

  # ── Server ─────────────────────────────────────────────────────────────────
  PORT: "8000"
  # Logs full LLM request/response bodies — deliberate for active monitoring.
  # Revisit when that tradeoff no longer holds.
  DEBUG: "true"
