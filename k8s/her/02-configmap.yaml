apiVersion: v1
kind: ConfigMap
metadata:
  name: her-server-config
  namespace: her
data:
  LLM_CHAT_URL: "https://api.z.ai/api/paas/v4/chat/completions"
  LLM_CHAT_MODEL: "glm-5.2"
  LLM_INITIATE_MODEL: "glm-4.5-air"
  LLM_EMBEDDINGS_URL: "https://integrate.api.nvidia.com/v1/embeddings"
  LLM_EMBEDDING_MODEL: "nvidia/nv-embed-v1"
  LLM_EMBEDDING_DIMENSIONS: "4096"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRES_MINUTES: "43200"
  OTP_TTL_MINUTES: "10"
  OTP_MAX_ATTEMPTS: "5"
  OTP_REQUEST_LIMIT_PER_HOUR: "5"
  GIRLFRIEND_UNLOCK_TRUST_SCORE: "40"
  MIN_AGE: "18"
  MAX_AGE_GAP_YEARS: "8"
  PORT: "8000"
  # Logs full LLM request/response bodies (entire persona prompts + user conversations) when
  # true - kept on for this deployment per explicit request, revisit before wider rollout.
  DEBUG: "true"
