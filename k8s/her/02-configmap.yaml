apiVersion: v1
kind: ConfigMap
metadata:
  name: her-server-config
  namespace: her
data:
  LLM_CHAT_URL: "https://api.fireworks.ai/inference/v1/chat/completions"
  # deepseek-v4-flash reproducibly hung on long-context non-streaming requests (fixed
  # server-side by streaming, see server/llm.py) but was also inconsistent run-to-run even
  # after that fix. Switched to Fireworks' hosted GLM-5.2 (glm-5p2 alias) - same weights as
  # z.ai's own glm-5.2, schema-compliant across trials, and 2-4x faster than z.ai in testing.
  LLM_CHAT_MODEL: "accounts/fireworks/models/glm-5p2"
  # Explicit rather than left to fall back to LLM_CHAT_MODEL - previously pinned to
  # glm-4.5-air, which only exists on z.ai and would 404 against the Fireworks URL above.
  LLM_INITIATE_MODEL: "accounts/fireworks/models/glm-5p2"
  LLM_EMBEDDINGS_URL: "https://integrate.api.nvidia.com/v1/embeddings"
  LLM_EMBEDDING_MODEL: "nvidia/nv-embed-v1"
  LLM_EMBEDDING_DIMENSIONS: "4096"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRES_MINUTES: "43200"
  OTP_TTL_MINUTES: "10"
  OTP_MAX_ATTEMPTS: "5"
  OTP_REQUEST_LIMIT_PER_HOUR: "5"
  GIRLFRIEND_UNLOCK_TRUST_SCORE: "40"
  MIN_AGE: "18"
  MAX_AGE_GAP_YEARS: "8"
  PORT: "8000"
  # Not secret - same project_id already embedded in the committed google-services.json.
  FIREBASE_PROJECT_ID: "itsher69"
  # Logs full LLM request/response bodies (entire persona prompts + real user conversations) -
  # kept on deliberately for active chat-behavior monitoring/debugging, not an oversight. Note
  # this means real conversation content lands in server logs in plaintext - revisit once that
  # tradeoff isn't worth it anymore.
  DEBUG: "true"
