# Job specs are immutable after creation - k8s won't let this get updated in place (image tag,
# etc), only deleted and recreated. Fixed name (not bumped per-migration) + this Kustomization's
# force: true (../flux/clusters/main/her.yaml) means Flux replaces it automatically on every
# sync when this file changes - no manual kubectl step needed. `alembic upgrade head` is
# idempotent - a no-op if nothing's pending - so re-running this on every deploy is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: her-server-migrate
  namespace: her
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U her; do echo waiting for postgres; sleep 3; done
      containers:
        - name: migrate
          image: ghcr.io/rafsunx/her-server:sha-9f28d15
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: her-server-config
            - secretRef:
                name: her-server-secrets
