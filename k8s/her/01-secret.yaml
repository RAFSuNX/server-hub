---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: her-server-secrets
  namespace: her
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: her-server-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: HER_DATABASE_URL
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: HER_POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: HER_JWT_SECRET
    - secretKey: API_KEY
      remoteRef:
        key: HER_API_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: HER_GOOGLE_CLIENT_ID
    - secretKey: FIREBASE_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: HER_FIREBASE_SERVICE_ACCOUNT_JSON
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: HER_RESEND_API_KEY
    - secretKey: RESEND_FROM_ADDRESS
      remoteRef:
        key: HER_RESEND_FROM_ADDRESS
    - secretKey: LLM_CHAT_API_KEY
      remoteRef:
        key: HER_LLM_CHAT_API_KEY
    - secretKey: LLM_EMBEDDINGS_API_KEY
      remoteRef:
        key: HER_LLM_EMBEDDINGS_API_KEY
    - secretKey: BASETEN_CHAT_API_KEY
      remoteRef:
        key: HER_BASETEN_CHAT_API_KEY
    - secretKey: USER_DATA_COLLECT_DATABASE
      remoteRef:
        key: HER_USER_DATA_COLLECT_DATABASE
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: her
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: password
      remoteRef:
        key: GHCR_TOKEN
