---
# Secrets pulled from Doppler project "her" (prd config).
# Requires a ClusterSecretStore named "doppler-her" backed by a Doppler
# service token scoped to the "her" project, prd environment.
#
# Create the service token:
#   doppler configs tokens create her-k8s --project her --config prd --plain
# Create the k8s secret holding it:
#   kubectl create secret generic doppler-her-token \
#     --from-literal=serviceToken=<token> -n external-secrets
# Then apply the ClusterSecretStore (see docs/doppler-her-store.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: her-server-secrets
  namespace: her
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-her
  target:
    name: her-server-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    # RLS-enforced app connection (role her_app). ENFORCEMENT FLIP — do NOT push this until:
    #   1. the RLS image is deployed inert (this mapping absent) and smoke-tested, AND
    #   2. the her_app role is bootstrapped: ALTER ROLE her_app LOGIN PASSWORD '<from Doppler>'.
    # Pushing before both → app connects as a role that can't log in → login/chat outage.
    # Rollback = remove this block. See server (config.database_url_app / db.py).
    - secretKey: DATABASE_URL_APP
      remoteRef:
        key: DATABASE_URL_APP
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: JWT_SECRET
    - secretKey: API_KEY
      remoteRef:
        key: API_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: GOOGLE_CLIENT_ID
    - secretKey: FIREBASE_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: FIREBASE_SERVICE_ACCOUNT_JSON
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: RESEND_FROM_ADDRESS
      remoteRef:
        key: RESEND_FROM_ADDRESS
    - secretKey: CHAT_MODEL_ONE_API_KEY
      remoteRef:
        key: CHAT_MODEL_ONE_API_KEY
    - secretKey: CHAT_MODEL_TWO_API_KEY
      remoteRef:
        key: CHAT_MODEL_TWO_API_KEY
    - secretKey: CHAT_MODEL_FOUR_API_KEY
      remoteRef:
        key: CHAT_MODEL_FOUR_API_KEY
    - secretKey: EMBEDDINGS_MODEL_ONE_API_KEY
      remoteRef:
        key: EMBEDDINGS_MODEL_ONE_API_KEY
    - secretKey: USER_DATA_COLLECT_DATABASE
      remoteRef:
        key: USER_DATA_COLLECT_DATABASE
    - secretKey: PROACTIVE_MODEL_ONE_API_KEY
      remoteRef:
        key: PROACTIVE_MODEL_ONE_API_KEY
    - secretKey: ONBOARDING_MODEL_ONE_API_KEY
      remoteRef:
        key: ONBOARDING_MODEL_ONE_API_KEY
    - secretKey: DATASET_HASH_SALT
      remoteRef:
        key: DATASET_HASH_SALT
    - secretKey: FREE_TIER_DAILY_LIMIT
      remoteRef:
        key: FREE_TIER_DAILY_LIMIT
    - secretKey: REVENUECAT_WEBHOOK_SECRET
      remoteRef:
        key: REVENUECAT_WEBHOOK_SECRET
---
# GHCR pull secret stays on the k3s Doppler project (shared infra credentials).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: her
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: password
      remoteRef:
        key: GHCR_TOKEN
