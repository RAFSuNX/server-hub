---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox
  namespace: tools
  labels:
    app: firefox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefox
  template:
    metadata:
      labels:
        app: firefox
        app.kubernetes.io/name: firefox
    spec:
      containers:
        - name: firefox
          image: linuxserver/firefox:latest
          ports:
            - containerPort: 3000
            - containerPort: 3001
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: TZ
              value: "UTC"
            - name: CUSTOM_USER
              valueFrom:
                secretKeyRef:
                  name: tools-auth
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tools-auth
                  key: password
          resources:

            requests:

              cpu: "1000m"

              memory: "1Gi"

            limits:

              cpu: "4000m"

              memory: "8Gi"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /config/Downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: firefox-config
        - name: downloads
          hostPath:
            path: /mnt/storage/Downloads
