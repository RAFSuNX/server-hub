---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: tools
data:
  settings.yaml: |
    title: rogx
    theme: dark
    color: slate
    headerStyle: clean
    cardBlur: md
    background:
      image: https://w.wallhaven.cc/full/xe/wallhaven-xe778z.jpg
      opacity: 60
    layout:
      Cluster:
        style: row
        columns: 2
      Media:
        style: row
        columns: 3
      Tools:
        style: row
        columns: 3

  kubernetes.yaml: |
    mode: cluster

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Hey, Rafsun!
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium
          hourCycle: h23
    - openmeteo:
        label: Dhaka
        latitude: 23.8103
        longitude: 90.4125
        timezone: Asia/Dhaka
        units: metric
        cache: 5
    - search:
        provider: google
        target: _blank

  services.yaml: |
    - Cluster:
        - Performance:
            widget:
              type: prometheusmetric
              url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
              metrics:
                - label: CPU
                  query: round(100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100), 0.1)
                  format:
                    type: number
                    suffix: " %"
                    options:
                      maximumFractionDigits: 1
                - label: Memory
                  query: round((1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100, 0.1)
                  format:
                    type: number
                    suffix: " %"
                    options:
                      maximumFractionDigits: 1
                - label: Disk
                  query: round((1 - min(node_filesystem_avail_bytes{mountpoint="/"}) / min(node_filesystem_size_bytes{mountpoint="/"})) * 100, 0.1)
                  format:
                    type: number
                    suffix: " %"
                    options:
                      maximumFractionDigits: 1
                - label: Storage
                  query: round((sum(node_filesystem_size_bytes{mountpoint="/mnt/storage"}) - sum(node_filesystem_avail_bytes{mountpoint="/mnt/storage"})) / 1073741824, 0.1)
                  format:
                    type: number
                    suffix: " GB"
                    options:
                      maximumFractionDigits: 1

        - Infrastructure:
            widget:
              type: prometheusmetric
              url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
              metrics:
                - label: Pods Running
                  query: count(kube_pod_status_phase{phase="Running"})
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Nodes Ready
                  query: count(kube_node_status_condition{condition="Ready",status="true"})
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Net In
                  query: round(sum(rate(node_network_receive_bytes_total{device!~"lo|veth.*|cni.*|flannel.*"}[5m])) / 1048576, 0.01)
                  format:
                    type: number
                    suffix: " MB/s"
                    options:
                      maximumFractionDigits: 2
                - label: Net Out
                  query: round(sum(rate(node_network_transmit_bytes_total{device!~"lo|veth.*|cni.*|flannel.*"}[5m])) / 1048576, 0.01)
                  format:
                    type: number
                    suffix: " MB/s"
                    options:
                      maximumFractionDigits: 2

    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: http://10.43.1.10
            description: Media Server
            namespace: media
            app: jellyfin
            widget:
              type: jellyfin
              url: http://jellyfin.media
              key: ea01a54d5d1d42199b4e9796346bdfa6

        - Sonarr:
            icon: sonarr.png
            href: http://10.43.1.11
            description: TV Shows
            namespace: media
            app: sonarr
            widget:
              type: sonarr
              url: http://sonarr.media
              key: 3d8ea60d3c3b47b0b91e1f7efd09e242

        - Radarr:
            icon: radarr.png
            href: http://10.43.1.12
            description: Movies
            namespace: media
            app: radarr
            widget:
              type: radarr
              url: http://radarr.media
              key: a49b84b735ab4d65ba1fc6c74979c71f

        - Seerr:
            icon: jellyseerr.png
            href: http://10.43.1.15
            description: Media Requests
            namespace: media
            app: seerr
            widget:
              type: customapi
              url: http://seerr.media/api/v1/request/count
              headers:
                X-Api-Key: MTc3Mjc3MzUxOTM4NzVkZGVkYjAxLTIxNzAtNDIwZi1iZDIyLTg3MDBmY2VkOWZmOQ==
              mappings:
                - field: processing
                  label: Processing
                  format: number
                - field: pending
                  label: Pending
                  format: number
                - field: completed
                  label: Available
                  format: number

        - Prowlarr:
            icon: prowlarr.png
            href: http://10.43.1.13
            description: Indexers
            namespace: media
            app: prowlarr
            widget:
              type: prowlarr
              url: http://prowlarr.media
              key: a37c56fbd4214fedab0ec9da9aebce1e

        - qBittorrent:
            icon: qbittorrent.png
            href: http://10.43.1.14
            description: Torrents
            namespace: media
            app: qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent.media
              username: rafsunx
              password: "Whatdoyoumean##xnxx"

    - Tools:
        - Kite:
            icon: kubernetes.png
            href: http://10.43.1.2
            description: K8s Dashboard
            namespace: kube-system
            app: kite

        - AriaNg:
            icon: https://raw.githubusercontent.com/mayswind/AriaNg-Native/master/assets/AriaNg.ico
            href: http://10.43.1.4
            description: Download Manager
            namespace: tools
            app: ariang

        - Firefox:
            icon: firefox.png
            href: http://10.43.1.5
            description: Browser
            namespace: tools
            app: firefox

        - n8n:
            icon: n8n.png
            href: http://10.43.1.7
            description: Automation
            namespace: tools
            app: n8n

        - Alist:
            icon: alist.png
            href: http://10.43.1.3
            description: File Manager
            namespace: tools
            app: alist

        - Transfer.sh:
            icon: http://10.43.1.6/favicon.ico
            href: http://10.43.1.6
            description: File Transfer
            namespace: tools
            app: transfersh

  bookmarks.yaml: |
    []
