apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.8.2"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  values:
    defaultSettings:
      defaultReplicaCount: 3
      storageMinimalAvailablePercentage: 10
      backupstorePollInterval: 0
      backupTarget: ""
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
    longhornUI:
      replicas: 0
    webhooks:
      conversion:
        enabled: false
      admission:
        enabled: false
