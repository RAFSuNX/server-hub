# Doppler ClusterSecretStore for the k3s project (config: prd).
# Auth token is a bootstrap secret created out-of-band (not in git):
#   kubectl create secret generic doppler-token -n default \
#     --from-literal=dopplerToken=<doppler service token for k3s/prd>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            namespace: default
            key: dopplerToken
