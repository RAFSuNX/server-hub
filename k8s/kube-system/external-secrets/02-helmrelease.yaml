apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: default
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: default
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    webhook:
      port: 9443
