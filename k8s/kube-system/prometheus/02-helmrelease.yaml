---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: kube-system
spec:
  interval: 30m
  targetNamespace: kube-system
  releaseName: prometheus
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: kube-system
  values:
    alertmanager:
      enabled: false
    grafana:
      enabled: false
