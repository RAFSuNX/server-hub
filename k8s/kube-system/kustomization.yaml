apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Longhorn first — storage foundation for everything with a PVC.
  - longhorn/00-namespace.yaml
  - longhorn/01-helmrepo.yaml
  - longhorn/02-helmrelease.yaml
  # External Secrets Operator (Doppler). Operator first; store added after CRDs exist.
  - external-secrets/01-helmrepo.yaml
  - external-secrets/02-helmrelease.yaml
  - external-secrets/03-clustersecretstore.yaml
  - kite/01-rbac.yaml
  - kite/00-secret.yaml
  - kite/02-storage.yaml
  - kite/03-deployment.yaml
  - kite/04-service.yaml
  # - flux-git-auth/00-fisense-secret.yaml
  # Prometheus after Longhorn is healthy:
  # - prometheus/01-helmrepository.yaml
  # - prometheus/02-helmrelease.yaml
