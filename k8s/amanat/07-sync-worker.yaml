# Ledger sync worker: LISTENs for ledger_sync notifications from the primary and
# incrementally replicates the public ledger tables to the external Supabase
# ledger DB (and backup once its schema has sync_id). Reuses the migrate image;
# just a different command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amanat-sync
  namespace: amanat
spec:
  replicas: 1
  # Single writer. Recreate (not RollingUpdate) so two workers never run at once
  # during a rollout; the Postgres advisory lock is the real guard, this is belt.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: amanat-sync
  template:
    metadata:
      labels:
        app: amanat-sync
    spec:
      containers:
        - name: sync
          image: ghcr.io/rafsunx/amanat-migrate:main
          imagePullPolicy: Always
          command: ["node", "scripts/sync-worker.mjs"]
          envFrom:
            - secretRef:
                name: amanat-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
