---
# ClusterSecretStore backed by Doppler project "amanat" (prd config).
# Bootstrap (one-time, out-of-band):
#   doppler configs tokens create amanat-k8s --project amanat --config prd --plain
#   kubectl create secret generic doppler-amanat-token \
#     --from-literal=dopplerToken=<token> -n default
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-amanat
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-amanat-token
            key: dopplerToken
            namespace: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amanat-secrets
  namespace: amanat
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-amanat
  target:
    name: amanat-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: AUDIT_DATABASE_URL
      remoteRef:
        key: AUDIT_DATABASE_URL
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: AUDIT_DB_PASSWORD
      remoteRef:
        key: AUDIT_DB_PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: REDIS_URL
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: BETTER_AUTH_SECRET
    - secretKey: BETTER_AUTH_URL
      remoteRef:
        key: BETTER_AUTH_URL
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: R2_ENDPOINT
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: R2_SECRET_ACCESS_KEY
    - secretKey: R2_BUCKET_NAME
      remoteRef:
        key: R2_BUCKET_NAME
    - secretKey: R2_PUBLIC_URL
      remoteRef:
        key: R2_PUBLIC_URL
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: RESEND_FROM_EMAIL
      remoteRef:
        key: RESEND_FROM_EMAIL
    - secretKey: BACKUP_DATABASE_URL
      remoteRef:
        key: BACKUP_DATABASE_URL
    - secretKey: REMOTE_PUBLIC_LEDGER_DATABASE_URL
      remoteRef:
        key: REMOTE_PUBLIC_LEDGER_DATABASE_URL
