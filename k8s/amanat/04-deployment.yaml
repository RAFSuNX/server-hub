---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amanat
  namespace: amanat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amanat
  template:
    metadata:
      labels:
        app: amanat
    spec:
      containers:
        - name: app
          image: ghcr.io/rafsunx/amanat:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: amanat-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: amanat
  namespace: amanat
spec:
  selector:
    app: amanat
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
