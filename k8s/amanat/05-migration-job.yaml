# Job specs are immutable - force: true in the Flux Kustomization replaces it automatically on every sync.
# Runs both main and audit DB migrations before the app starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: amanat
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Dedicated migrate image has drizzle-kit + SQL; app image is pruned standalone and cannot run migrations.
          image: ghcr.io/rafsunx/amanat-migrate:main
          envFrom:
            - secretRef:
                name: amanat-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
