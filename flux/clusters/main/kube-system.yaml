apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system-apps
  namespace: default
spec:
  interval: 10m
  path: ./k8s/kube-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: default
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: default
