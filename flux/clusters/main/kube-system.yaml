apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/kube-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: server-hub
  decryption:
    provider: sops
    secretRef:
      name: sops-age
