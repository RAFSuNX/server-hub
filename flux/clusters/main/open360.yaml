---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: open360
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/RAFSuNX/OPEN360
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open360-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/open360
  prune: true
  sourceRef:
    kind: GitRepository
    name: server-hub
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open360
  namespace: flux-system
spec:
  dependsOn:
    - name: open360-secrets
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: open360
