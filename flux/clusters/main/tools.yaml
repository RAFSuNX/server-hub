apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tools
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 5m
  path: ./k8s/tools
  prune: true
  sourceRef:
    kind: GitRepository
    name: server-hub
  decryption:
    provider: sops
    secretRef:
      name: sops-age
