[Service]
# Flush any f2b-* chains restored by netfilter-persistent before fail2ban starts.
# This prevents duplicate rules when both netfilter-persistent and fail2ban
# try to manage the same chains on boot.
ExecStartPre=/bin/sh -c '\
  iptables -D INPUT -p tcp --dport 22 -j f2b-sshd 2>/dev/null || true; \
  iptables -F f2b-sshd 2>/dev/null || true; \
  iptables -X f2b-sshd 2>/dev/null || true'
