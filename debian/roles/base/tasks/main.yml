---
- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Remove insecure packages
  ansible.builtin.apt:
    name: "{{ base_packages_remove }}"
    state: absent
    purge: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages_install }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure passwordless sudo for {{ ansible_user }}
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/{{ ansible_user }}
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Discover local user home directories
  ansible.builtin.find:
    paths: /home
    file_type: directory
  register: home_dirs

- name: Ensure ~/.local/bin is on PATH for every found user (incl. root)
  # uv (and other user-installed tooling) puts binaries in ~/.local/bin;
  # without this on PATH, freshly `uv`-installed pythons/tools silently
  # aren't runnable in interactive shells.
  ansible.builtin.blockinfile:
    path: "{{ item }}/.bashrc"
    marker: "# {mark} local bin PATH"
    create: true
    owner: "{{ item | basename }}"
    group: "{{ item | basename }}"
    mode: "0644"
    block: |
      if [ -d "$HOME/.local/bin" ] ; then
          PATH="$HOME/.local/bin:$PATH"
      fi
  loop: "{{ (home_dirs.files | map(attribute='path') | list) + ['/root'] }}"

- name: Apply kernel hardening via sysctl
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl

- name: Disable unused kernel modules
  ansible.builtin.template:
    src: modprobe-disable.conf.j2
    dest: /etc/modprobe.d/99-disable-unused.conf
    owner: root
    group: root
    mode: "0644"

- name: Harden /tmp - noexec, nosuid, nodev
  ansible.builtin.copy:
    dest: /etc/systemd/system/tmp.mount
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Temporary Directory /tmp
      ConditionPathIsSymbolicLink=!/tmp
      DefaultDependencies=no
      Conflicts=umount.target
      Before=local-fs.target umount.target
      After=swap.target

      [Mount]
      What=tmpfs
      Where=/tmp
      Type=tmpfs
      Options=mode=1777,strictatime,noexec,nodev,nosuid,size=512M

      [Install]
      WantedBy=local-fs.target
  notify: reload systemd and remount tmp

- name: Enable hardened /tmp mount
  # Not started live here on purpose: remounting /tmp as tmpfs mid-play can
  # wipe Ansible's own in-flight module payload out from under itself if it
  # lands under /tmp. Enabling only, takes effect on next boot.
  ansible.builtin.systemd:
    name: tmp.mount
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Add cluster node hostnames to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} OciSystem cluster nodes"
    block: |
      {% for host in groups['ociSystem'] %}
      {{ hostvars[host]['tailscale_node_ip'] }} {{ host }}
      {% endfor %}
  when: "'ociSystem' in group_names"

- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary

- name: Disable Docker iptables manipulation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "iptables": false,
        "ip6tables": false
      }
  when: docker_binary.stat.exists
  notify: restart docker

- name: Check for isc-dhcp-client
  ansible.builtin.stat:
    path: /usr/sbin/dhclient
  register: dhclient_binary

- name: Check for dhcpcd
  ansible.builtin.stat:
    path: /usr/sbin/dhcpcd
  register: dhcpcd_binary

- name: Stop dhclient overwriting resolv.conf on lease renewal/boot
  # OCI's DHCP client rewrites /etc/resolv.conf with the cloud metadata
  # resolver (169.254.169.254) on every reboot otherwise, silently
  # reverting our configured resolvers.
  ansible.builtin.copy:
    dest: /etc/dhcp/dhclient-enter-hooks.d/no-resolvconf-overwrite
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      make_resolv_conf() { :; }
  when: dhclient_binary.stat.exists

- name: Stop dhcpcd overwriting resolv.conf on lease renewal/boot
  # Same OCI metadata-resolver problem as dhclient above, but dhcpcd
  # (used on non-ISC-dhclient hosts, e.g. servera) has its own opt-out.
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    line: "nohook resolv.conf"
    insertafter: EOF
  when: dhcpcd_binary.stat.exists

- name: Configure DNS resolvers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended security upgrades
  ansible.builtin.template:
    src: unattended-upgrades.conf.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Disable unattended-upgrades service
  # Manual upgrades only — auto-upgrades restarted tailscaled mid-flight on
  # all cluster nodes simultaneously (1.98.8→1.102.2, 2026-08-09 22:51),
  # destroying Flannel's VXLAN interface and taking down pod networking.
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  failed_when: false

- name: Disable apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Set GRUB to boot straight to OS - no menu, no timeout (server, not desktop)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_TIMEOUT='
    line: "GRUB_TIMEOUT=0"
  notify: update grub
  when: not ansible_check_mode
