---
- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: not ansible_check_mode

- name: reload systemd and remount tmp
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: update grub
  ansible.builtin.command: update-grub
  changed_when: true
