---
- name: Install GlusterFS server and client
  ansible.builtin.apt:
    name:
      - glusterfs-server
      - glusterfs-client
    state: present
    update_cache: true

- name: Enable and start glusterd
  ansible.builtin.systemd:
    name: glusterd
    enabled: true
    state: started

- name: Create brick directory
  ansible.builtin.file:
    path: "{{ glusterfs_brick_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create storage mount directory
  ansible.builtin.file:
    path: "{{ glusterfs_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Probe all peers (init node only)
  ansible.builtin.command: gluster peer probe {{ item }}
  loop: "{{ groups['ociSystem'] }}"
  when: inventory_hostname == glusterfs_init_node
  register: peer_probe
  changed_when: "'already in peer list' not in peer_probe.stdout"
  failed_when:
    - peer_probe.rc != 0
    - "'already in peer list' not in peer_probe.stdout"

- name: Wait for peers to connect
  ansible.builtin.command: gluster peer status
  register: peer_status
  until: "'Connected' in peer_status.stdout"
  retries: 12
  delay: 5
  changed_when: false
  when: inventory_hostname == glusterfs_init_node

- name: Create distributed GlusterFS volume (init node only)
  ansible.builtin.command: >
    gluster volume create {{ glusterfs_volume_name }}
    transport tcp
    {% for node in groups['ociSystem'] %}{{ node }}:{{ glusterfs_brick_path }} {% endfor %}
    force
  when: inventory_hostname == glusterfs_init_node
  register: volume_create
  failed_when:
    - volume_create.rc != 0
    - "'already exists' not in volume_create.stderr"
  changed_when: "'already exists' not in volume_create.stderr"

- name: Start GlusterFS volume (init node only)
  ansible.builtin.command: gluster volume start {{ glusterfs_volume_name }} force
  when: inventory_hostname == glusterfs_init_node
  register: volume_start
  failed_when:
    - volume_start.rc != 0
    - "'already started' not in volume_start.stderr"
  changed_when: "'already started' not in volume_start.stderr"

- name: Enable volume quota (init node only)
  ansible.builtin.command: gluster volume quota {{ glusterfs_volume_name }} enable
  when: inventory_hostname == glusterfs_init_node
  register: quota_enable
  failed_when:
    - quota_enable.rc != 0
    - "'already enabled' not in quota_enable.stderr"
  changed_when: "'already enabled' not in quota_enable.stderr"

- name: Check current quota limit (init node only)
  ansible.builtin.command: gluster volume quota {{ glusterfs_volume_name }} list
  when: inventory_hostname == glusterfs_init_node
  register: quota_list
  changed_when: false

- name: Set per-node brick size limit via quota (init node only)
  ansible.builtin.command: >
    gluster volume quota {{ glusterfs_volume_name }}
    limit-usage / {{ glusterfs_total_quota }}
  when: >
    inventory_hostname == glusterfs_init_node and
    glusterfs_total_quota not in quota_list.stdout
  changed_when: true

- name: Mount GlusterFS volume on all nodes
  # noauto - boot-time mounting is handled by glusterfs-mount-retry.service
  # below instead, since the fstab auto-mount only waits for glusterd.service
  # to start, not for it to finish reconnecting to peers over Tailscale.
  ansible.posix.mount:
    path: "{{ glusterfs_mount_path }}"
    src: "localhost:/{{ glusterfs_volume_name }}"
    fstype: glusterfs
    opts: "noauto,_netdev,backupvolfile-server={{ glusterfs_init_node }}"
    state: mounted

- name: Deploy GlusterFS mount retry unit
  ansible.builtin.template:
    src: glusterfs-mount-retry.service.j2
    dest: /etc/systemd/system/glusterfs-mount-retry.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and restart glusterfs mount retry unit

- name: Enable GlusterFS mount retry unit
  ansible.builtin.systemd:
    name: glusterfs-mount-retry
    enabled: true
    daemon_reload: true
