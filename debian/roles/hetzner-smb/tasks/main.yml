---
- name: Install cifs-utils
  ansible.builtin.apt:
    name: cifs-utils
    state: present
    update_cache: true

- name: Create mount point
  ansible.builtin.file:
    path: "{{ hetzner_smb_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create SMB credentials file
  ansible.builtin.copy:
    dest: /etc/hetzner-smb.creds
    owner: root
    group: root
    mode: "0600"
    content: |
      username={{ hetzner_smb_user }}
      password={{ hetzner_smb_pass }}

- name: Mount Hetzner storage box
  ansible.posix.mount:
    path: "{{ hetzner_smb_mount }}"
    src: "//{{ hetzner_smb_host }}/{{ hetzner_smb_share }}"
    fstype: cifs
    opts: credentials=/etc/hetzner-smb.creds,uid=1000,gid=1000,file_mode=0755,dir_mode=0755,vers=3.0,_netdev,nofail
    state: mounted
