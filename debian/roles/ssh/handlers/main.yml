---
# Both handlers listen to the same notify - validate runs first, then restart.
# If validate fails, restart never fires and the task reports failed safely.

- name: validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: validate and restart sshd

- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: validate and restart sshd
