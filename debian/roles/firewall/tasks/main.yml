---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Disable and remove iptables (replaced by nftables)
  ansible.builtin.systemd:
    name: iptables
    enabled: false
    state: stopped
  failed_when: false

- name: Deploy nftables config
  ansible.builtin.template:
    src: "{{ 'nftables-standalone.conf.j2' if 'standalone' in group_names else 'nftables.conf.j2' }}"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: nft -c -f %s
  notify: reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
