---
- name: Install curl and gnupg
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian bookworm main\n"
    owner: root
    group: root
    mode: "0644"

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Set tailscaled tunnel MTU override in /etc/default/tailscaled
  ansible.builtin.lineinfile:
    path: /etc/default/tailscaled
    regexp: '^TS_DEBUG_MTU='
    line: 'TS_DEBUG_MTU="{{ tailscale_mtu }}"'
  notify: restart tailscaled

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Install ethtool
  ansible.builtin.apt:
    name: ethtool
    state: present

- name: Deploy UDP GRO forwarding offload unit (exit node/subnet router perf)
  ansible.builtin.template:
    src: tailscale-udp-gro.service.j2
    dest: /etc/systemd/system/tailscale-udp-gro.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and restart udp-gro unit

- name: Enable and start UDP GRO forwarding offload unit
  ansible.builtin.systemd:
    name: tailscale-udp-gro
    enabled: true
    state: started
    daemon_reload: true

- name: Connect to Tailscale network
  ansible.builtin.command:
    cmd: >
      tailscale up
      --auth-key={{ tailscale_auth_key }}
      --accept-routes={{ tailscale_accept_routes | lower }}
      --accept-dns=false
      {{ '--advertise-exit-node' if tailscale_advertise_exit_node else '' }}
  register: tailscale_up
  changed_when: tailscale_up.rc == 0
  no_log: true

- name: Verify Tailscale is connected
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false

- name: Show Tailscale status
  ansible.builtin.debug:
    msg: "{{ tailscale_status.stdout_lines }}"
