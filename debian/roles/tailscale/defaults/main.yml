---
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
tailscale_advertise_exit_node: true
tailscale_accept_routes: true

# Undocumented tailscaled debug env var, overrides the default 1280 tunnel
# MTU. Nodes are on separate public IPs/regions (not a shared jumbo-frame
# LAN), so anything above the standard internet path ceiling (~1400-1420)
# risks silent packet drops. Revert to unset/1280 if connectivity degrades.
tailscale_mtu: 8000
