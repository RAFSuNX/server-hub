---
# Security baseline - idempotent, safe to re-run anytime.
# Applies to both ociSystem and standalone groups; per-group values
# (ssh_port, etc.) come from inventory/group_vars, not from this playbook.
- name: Security baseline
  hosts: ociSystem,standalone
  become: true
  roles:
    - base
    - ntp
    - ssh
    - firewall
    - fail2ban
