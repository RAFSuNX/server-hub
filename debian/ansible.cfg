[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
host_key_checking   = True
retry_files_enabled = False
# base role remounts /tmp as tmpfs mid-play - keep Ansible's module payload
# out of /tmp or that remount wipes it out from under itself.
remote_tmp          = /var/tmp/ansible-tmp
stdout_callback     = default
result_format       = yaml
gathering           = smart
fact_caching        = memory

[ssh_connection]
pipelining          = True
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s
