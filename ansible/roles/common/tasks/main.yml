---
- name: Install fail2ban (Debian)
  apt:
    name: fail2ban
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  become: yes

- name: Install fail2ban (Alpine)
  community.general.apk:
    name: fail2ban
    state: present
  when: ansible_os_family == "Alpine"
  become: yes

- name: Deploy SSH hardening config
  copy:
    src: 99-hardening.conf
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: restart sshd

- name: Deploy fail2ban jail.local (Debian)
  copy:
    src: jail.local.debian
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Debian"
  become: yes
  notify: restart fail2ban

- name: Deploy fail2ban jail.local (Alpine)
  copy:
    src: jail.local.alpine
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Alpine"
  become: yes
  notify: restart fail2ban

- name: Deploy firewall script
  copy:
    src: firewall.sh
    dest: /usr/local/bin/firewall.sh
    owner: root
    group: root
    mode: '0755'
  become: yes
  notify: apply firewall

- name: Enable and start fail2ban (Debian)
  systemd:
    name: fail2ban
    enabled: yes
    state: started
  when: ansible_os_family == "Debian"
  become: yes

- name: Enable and start fail2ban (Alpine)
  command: rc-update add fail2ban default
  when: ansible_os_family == "Alpine"
  become: yes
  changed_when: false

- name: Remove immutable flag from resolv.conf
  command: chattr -i /etc/resolv.conf
  become: yes
  failed_when: false
  changed_when: false

- name: Set DNS (Cloudflare primary, Google backup - IPv4 + IPv6)
  copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
      nameserver 2606:4700:4700::1111
      nameserver 2001:4860:4860::8888
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Lock resolv.conf immutable
  command: chattr +i /etc/resolv.conf
  become: yes
  changed_when: false

- name: Disable Tailscale DNS management
  command: tailscale set --accept-dns=false
  become: yes
  changed_when: false
