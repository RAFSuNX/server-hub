---
- name: Generate SSH keypair for rafsunx
  community.crypto.openssh_keypair:
    path: /home/rafsunx/.ssh/id_ed25519
    type: ed25519
    owner: rafsunx
    group: rafsunx
  become: yes

- name: Read public key
  slurp:
    src: /home/rafsunx/.ssh/id_ed25519.pub
  register: pubkey
  become: yes

- name: Store public key as fact
  set_fact:
    my_pubkey: "{{ pubkey['content'] | b64decode | trim }}"

- name: Distribute all public keys to authorized_keys
  authorized_key:
    user: rafsunx
    key: "{{ hostvars[item]['my_pubkey'] }}"
    state: present
  loop: "{{ groups['servers'] }}"
  when: item != inventory_hostname
  become: yes

- name: Deploy SSH client config
  template:
    src: ssh_config.j2
    dest: /home/rafsunx/.ssh/config
    owner: rafsunx
    group: rafsunx
    mode: '0600'
  become: yes
